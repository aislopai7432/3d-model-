<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b0d">
<title>Aeris Strata Configurator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Procedurally modelled sports car in a real-time studio, built with Three.js.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Michroma&display=swap">
<style>
  /* Layout: full-bleed WebGL stage; brand top-left, actions top-right,
     camera rail on the left (chips above the panel on phones), configurator sheet at the bottom. */
  :root {
    color-scheme: dark;
    --stage: #0a0b0d;
    --ink: #eceae6;
    --ink-2: #a39f98;
    --ink-3: #6f6c67;
    --line: rgba(236, 234, 230, 0.12);
    --glass: rgba(14, 15, 18, 0.72);
    --accent: #c9ae84;
    --font-display: "Michroma", "Eurostile", "Arial Black", sans-serif;
    --font-ui: "Manrope", "Helvetica Neue", Arial, sans-serif;
    --ease: cubic-bezier(.22, .8, .24, 1);
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--stage);
    color: var(--ink);
    font: 500 13px/1.45 var(--font-ui);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
  .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%); }

  /* loader */
  #loader {
    position: fixed; inset: 0; display: grid; place-items: center; background: var(--stage);
    transition: opacity .9s var(--ease) .2s, visibility 0s 1.2s; z-index: 30;
  }
  .ready #loader { opacity: 0; visibility: hidden; }
  .loader-in { display: grid; gap: 18px; justify-items: center; text-align: center; padding-inline: 24px; }
  .loader-mark { font: 400 22px/1 var(--font-display); letter-spacing: .5em; padding-left: .5em; }
  .loader-bar { width: 180px; height: 1px; background: var(--line); overflow: hidden; }
  .loader-bar::after { content: ""; display: block; height: 100%; width: 40%; background: var(--accent); animation: load 1.4s var(--ease) infinite; }
  @keyframes load { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  #loader-status { color: var(--ink-3); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }

  /* chrome */
  .ui { position: fixed; z-index: 10; opacity: 0; transform: translateY(8px); transition: opacity .9s var(--ease) .5s, transform .9s var(--ease) .5s; }
  .ready .ui { opacity: 1; transform: none; }
  header.ui {
    top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
    padding-top: calc(env(safe-area-inset-top, 0px) + 20px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    pointer-events: none;
  }
  header.ui > * { pointer-events: auto; }
  .brand { display: grid; gap: 6px; min-width: 0; }
  .brand .maker { font: 400 10px/1 var(--font-display); letter-spacing: .42em; color: var(--ink-2); }
  .brand h1 { margin: 0; font: 400 clamp(20px, 3.2vw, 30px)/1.05 var(--font-display); letter-spacing: .08em; text-wrap: balance; }
  .brand .sub { color: var(--ink-3); font-size: 12px; letter-spacing: .02em; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

  .btn {
    appearance: none; border: 1px solid var(--line); background: var(--glass); color: var(--ink);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    height: 36px; padding: 0 14px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px;
    font: 600 11px/1 var(--font-ui); letter-spacing: .1em; text-transform: uppercase; cursor: pointer;
    transition: border-color .25s, background .25s, color .25s;
  }
  .btn svg { width: 15px; height: 15px; flex: none; }
  .btn:hover { border-color: rgba(236,234,230,.32); }
  .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .btn:focus-visible, .swatch:focus-visible, .chip:focus-visible, .tab:focus-visible, .style-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.icon { width: 36px; padding: 0; justify-content: center; }

  /* camera rail */
  nav.views {
    left: max(16px, env(safe-area-inset-left, 0px)); top: 50%; transform: translateY(-50%);
    display: grid; gap: 2px;
  }
  .ready nav.views { transform: translateY(-50%); }
  .chip {
    appearance: none; border: 0; background: none; color: var(--ink-3); cursor: pointer; text-align: left;
    font: 600 10.5px/1 var(--font-ui); letter-spacing: .16em; text-transform: uppercase; padding: 9px 0 9px 18px; position: relative;
    transition: color .25s;
  }
  .chip::before { content: ""; position: absolute; left: 0; top: 50%; width: 8px; height: 1px; background: currentColor; transition: width .35s var(--ease); }
  .chip:hover { color: var(--ink-2); }
  .chip[aria-pressed="true"] { color: var(--ink); }
  .chip[aria-pressed="true"]::before { width: 12px; background: var(--accent); }

  /* configurator sheet */
  section.panel {
    left: 50%; bottom: 0; width: min(620px, 100%);
    transform: translate(-50%, 8px);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
  }
  .ready section.panel { transform: translate(-50%, 0); }
  .sheet {
    background: var(--glass); border: 1px solid var(--line); border-radius: 18px;
    -webkit-backdrop-filter: blur(18px) saturate(1.2); backdrop-filter: blur(18px) saturate(1.2);
    overflow: hidden;
  }
  .tabs { display: flex; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    appearance: none; border: 0; background: none; color: var(--ink-3); cursor: pointer; flex: 1 0 auto;
    font: 600 10.5px/1 var(--font-ui); letter-spacing: .16em; text-transform: uppercase; padding: 15px 14px 14px; position: relative;
  }
  .tab[aria-selected="true"] { color: var(--ink); }
  .tab[aria-selected="true"]::after { content: ""; position: absolute; left: 30%; right: 30%; bottom: -1px; height: 1px; background: var(--accent); }
  .pane { padding: 16px 18px 18px; display: grid; gap: 16px; }
  .row { display: grid; gap: 10px; min-width: 0; }
  .row-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .row-label { color: var(--ink-3); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; }
  .row-value { font: 400 12px/1.2 var(--font-display); letter-spacing: .04em; text-align: right; }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatch {
    --sw: #888; appearance: none; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; padding: 0;
    border: 1px solid rgba(255,255,255,.18);
    background:
      radial-gradient(circle at 34% 28%, rgba(255,255,255,.55), rgba(255,255,255,0) 42%),
      radial-gradient(circle at 70% 80%, rgba(0,0,0,.45), rgba(0,0,0,0) 60%),
      var(--sw);
    box-shadow: 0 0 0 0 var(--accent);
    transition: box-shadow .3s var(--ease), transform .3s var(--ease);
  }
  .swatch:hover { transform: translateY(-1px); }
  .swatch[aria-checked="true"] { box-shadow: 0 0 0 2px var(--stage), 0 0 0 3px var(--accent); }
  .styles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .style-btn {
    appearance: none; background: rgba(255,255,255,.02); border: 1px solid var(--line); border-radius: 12px; color: var(--ink-2);
    padding: 10px 8px 9px; display: grid; justify-items: center; gap: 6px; cursor: pointer;
    font: 600 10px/1.2 var(--font-ui); letter-spacing: .1em; text-transform: uppercase;
  }
  .style-btn svg { width: 40px; height: 40px; }
  .style-btn[aria-checked="true"] { border-color: var(--accent); color: var(--ink); }
  .toggles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .toggles .btn { justify-content: flex-start; height: 42px; border-radius: 12px; }
  .toggles .btn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); margin-left: auto; transition: background .25s, box-shadow .25s; }
  .toggles .btn[aria-pressed="true"] .dot { background: var(--accent); box-shadow: 0 0 10px var(--accent); }

  /* spec plate */
  aside.spec {
    right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
    display: grid; grid-template-columns: auto auto; gap: 6px 18px; align-items: baseline;
    font-variant-numeric: tabular-nums;
  }
  .spec dt { color: var(--ink-3); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; }
  .spec dd { margin: 0; font: 400 13px/1.1 var(--font-display); text-align: right; }
  .hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 40px + var(--sheet-h, 214px)); text-align: center; width: max-content; max-width: calc(100% - 32px); color: var(--ink-3); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; pointer-events: none; z-index: 5; opacity: 0; transition: opacity 1s; }
  .ready .hint { opacity: .8; animation: hintOut 1s 6s forwards; }
  @keyframes hintOut { to { opacity: 0; } }

  @media (max-width: 1080px) { aside.spec { display: none; } }
  @media (max-width: 760px) {
    header.ui { padding-top: calc(env(safe-area-inset-top, 0px) + 14px); }
    .brand .sub { display: none; }
    .actions .btn:not(.icon) .lbl { display: none; }
    .actions .btn:not(.icon) { width: 36px; padding: 0; justify-content: center; }
    nav.views {
      top: auto; transform: none; left: 0; right: 0;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 28px + var(--sheet-h, 214px));
      display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
      padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    }
    .ready nav.views { transform: none; }
    nav.views::-webkit-scrollbar { display: none; }
    .chip { flex: none; padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--glass); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
    .chip::before { display: none; }
    .chip[aria-pressed="true"] { border-color: var(--accent); }
    .pane { padding: 14px 14px 14px; gap: 12px; min-height: 150px; align-content: start; }
    .swatch { width: 30px; height: 30px; }
    .swatches { gap: 9px; }
    .hint { bottom: calc(env(safe-area-inset-bottom, 0px) + 80px + var(--sheet-h, 214px)); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

</head>
<body>
<canvas id="scene" tabindex="0" aria-label="Interactive 3D view of the Aeris Strata. Drag to orbit, scroll or pinch to zoom, right-drag or two-finger drag to pan."></canvas>
<div class="vignette"></div>

<div id="loader" role="status">
  <div class="loader-in">
    <div class="loader-mark">AERIS</div>
    <div class="loader-bar"></div>
    <div id="loader-status">Preparing studio</div>
  </div>
</div>

<header class="ui">
  <div class="brand">
    <span class="maker">AERIS AUTOMOBILI</span>
    <h1>STRATA GT</h1>
    <span class="sub">Mid-engine coupé · Configuration 01</span>
  </div>
  <div class="actions">
    <button class="btn" id="t-showcase" type="button" aria-pressed="false" title="360° presentation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
      <span class="lbl">360°</span>
    </button>
    <button class="btn" id="t-quality" type="button" title="Switch render quality">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      <span class="lbl">Quality</span>
    </button>
    <button class="btn icon" id="t-reset" type="button" title="Reset camera" aria-label="Reset camera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg>
    </button>
    <button class="btn icon" id="t-full" type="button" aria-pressed="false" title="Full screen" aria-label="Full screen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
</header>

<nav class="ui views" aria-label="Camera views">
  <button class="chip" type="button" data-view="hero" aria-pressed="true">Three-quarter</button>
  <button class="chip" type="button" data-view="front" aria-pressed="false">Front</button>
  <button class="chip" type="button" data-view="side" aria-pressed="false">Profile</button>
  <button class="chip" type="button" data-view="rear" aria-pressed="false">Rear</button>
  <button class="chip" type="button" data-view="top" aria-pressed="false">Plan</button>
  <button class="chip" type="button" data-view="wheel" aria-pressed="false">Wheel</button>
  <button class="chip" type="button" data-view="interior" aria-pressed="false">Cockpit</button>
</nav>

<div class="hint">Drag to orbit · Pinch or scroll to zoom</div>

<section class="ui panel" aria-label="Configurator">
  <div class="sheet">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" type="button" aria-selected="true" aria-controls="pane-paint" id="tab-paint">Paint</button>
      <button class="tab" role="tab" type="button" aria-selected="false" aria-controls="pane-wheels" id="tab-wheels">Wheels</button>
      <button class="tab" role="tab" type="button" aria-selected="false" aria-controls="pane-lights" id="tab-lights">Lights</button>
      <button class="tab" role="tab" type="button" aria-selected="false" aria-controls="pane-cabin" id="tab-cabin">Cabin</button>
    </div>
    <div class="pane" id="pane-paint" role="tabpanel" aria-labelledby="tab-paint">
      <div class="row">
        <div class="row-head"><span class="row-label">Exterior colour</span><span class="row-value" id="paint-name"></span></div>
        <div class="swatches" id="paints" role="radiogroup" aria-label="Exterior colour"></div>
      </div>
      <div class="row">
        <div class="row-head"><span class="row-label">Brake callipers</span><span class="row-value" id="caliper-name"></span></div>
        <div class="swatches" id="calipers" role="radiogroup" aria-label="Brake calliper colour"></div>
      </div>
    </div>
    <div class="pane" id="pane-wheels" role="tabpanel" aria-labelledby="tab-wheels" hidden>
      <div class="row">
        <div class="row-head"><span class="row-label">Design · 20 in</span><span class="row-value" id="style-name"></span></div>
        <div class="styles" id="styles" role="radiogroup" aria-label="Wheel design">
          <button class="style-btn" type="button" role="radio" data-id="0" aria-checked="true">
            <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="20" cy="20" r="18"/><circle cx="20" cy="20" r="4"/><g id="s10"><path d="M19 16 18 3M21 16 22 3"/></g><use href="#s10" transform="rotate(72 20 20)"/><use href="#s10" transform="rotate(144 20 20)"/><use href="#s10" transform="rotate(216 20 20)"/><use href="#s10" transform="rotate(288 20 20)"/></svg>
            Split ten
          </button>
          <button class="style-btn" type="button" role="radio" data-id="1" aria-checked="false">
            <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="20" cy="20" r="18"/><circle cx="20" cy="20" r="4"/><g id="sy"><path d="M20 16v-6l-5-7M20 10l5-7"/></g><use href="#sy" transform="rotate(72 20 20)"/><use href="#sy" transform="rotate(144 20 20)"/><use href="#sy" transform="rotate(216 20 20)"/><use href="#sy" transform="rotate(288 20 20)"/></svg>
            Forged Y
          </button>
          <button class="style-btn" type="button" role="radio" data-id="2" aria-checked="false">
            <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="20" cy="20" r="18"/><circle cx="20" cy="20" r="4"/><g id="st"><path d="M20 16c0-5 2-9 6-13"/></g><use href="#st" transform="rotate(40 20 20)"/><use href="#st" transform="rotate(80 20 20)"/><use href="#st" transform="rotate(120 20 20)"/><use href="#st" transform="rotate(160 20 20)"/><use href="#st" transform="rotate(200 20 20)"/><use href="#st" transform="rotate(240 20 20)"/><use href="#st" transform="rotate(280 20 20)"/><use href="#st" transform="rotate(320 20 20)"/></svg>
            Turbine
          </button>
        </div>
      </div>
      <div class="row">
        <div class="row-head"><span class="row-label">Finish</span><span class="row-value" id="finish-name"></span></div>
        <div class="swatches" id="finishes" role="radiogroup" aria-label="Wheel finish"></div>
      </div>
    </div>
    <div class="pane" id="pane-lights" role="tabpanel" aria-labelledby="tab-lights" hidden>
      <div class="toggles">
        <button class="btn" id="t-head" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M10 5C5 5 3 8.5 3 12s2 7 7 7h1V5h-1Z"/><path d="M15 8h6M15 12h6M15 16h6"/></svg>
          <span class="lbl">Headlights</span><span class="dot"></span>
        </button>
        <button class="btn" id="t-brake" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M3 8a10 10 0 0 0 0 8M21 8a10 10 0 0 1 0 8"/></svg>
          <span class="lbl">Brake lights</span><span class="dot"></span>
        </button>
        <button class="btn" id="t-hazard" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 4 21 19H3L12 4Z"/><path d="M12 10v4M12 16.5v.5"/></svg>
          <span class="lbl">Hazards</span><span class="dot"></span>
        </button>
        <button class="btn" id="t-ambient" type="button" aria-pressed="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 17c4-3 12-3 16 0"/><path d="M12 4v3M5.6 6.6l2 2M18.4 6.6l-2 2"/></svg>
          <span class="lbl">Ambient</span><span class="dot"></span>
        </button>
      </div>
    </div>
    <div class="pane" id="pane-cabin" role="tabpanel" aria-labelledby="tab-cabin" hidden>
      <div class="row">
        <div class="row-head"><span class="row-label">Upholstery</span><span class="row-value" id="interior-name"></span></div>
        <div class="swatches" id="interiors" role="radiogroup" aria-label="Upholstery"></div>
      </div>
      <div class="toggles">
        <button class="btn" id="t-doors" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 20V9l7-5h7v16H5Z"/><path d="M15 13h2"/></svg>
          <span class="lbl">Open doors</span><span class="dot"></span>
        </button>
        <button class="btn" type="button" data-view="interior" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/><path d="M4 12h6M14 12h6M12 14v6"/></svg>
          <span class="lbl">Cockpit view</span><span class="dot"></span>
        </button>
      </div>
    </div>
  </div>
</section>

<aside class="ui spec" aria-label="Specification">
  <dt>Power</dt><dd>640 PS</dd>
  <dt>0–100 km/h</dt><dd>2.9 s</dd>
  <dt>Top speed</dt><dd>325 km/h</dd>
  <dt>Kerb weight</dt><dd>1,420 kg</dd>
</aside>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
